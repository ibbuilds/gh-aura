name: Temporary profile screenshot visual study
on:
  push:
    branches: [research/holistic-category-triage]
    paths: ['.github/workflows/holistic-visual-pilot.yml']
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Screenshot public GitHub profile overview in Chrome (ephemeral only)
        shell: bash
        run: |
          set -euo pipefail
          for user in simonw WenyuChiou; do
            chromium --headless --no-sandbox --disable-gpu --hide-scrollbars --disable-extensions --disable-dev-shm-usage --virtual-time-budget=4500 --window-size=1220,1750 --screenshot="/tmp/${user}.png" "https://github.com/${user}" >/tmp/chrome-log 2>&1 || true
            if [[ ! -s "/tmp/${user}.png" ]]; then echo "SCREENSHOT_ERROR:${user}"; continue; fi
            if command -v convert >/dev/null; then
              convert "/tmp/${user}.png" -resize '1040x1500>' -strip -quality 73 "/tmp/${user}.jpg"
            else
              cp "/tmp/${user}.png" "/tmp/${user}.jpg"
            fi
            IMAGEUSER="$user" node -e 'const fs=require("fs");const name=process.env.IMAGEUSER;const buf=fs.readFileSync("/tmp/"+name+".jpg");const p=buf.toString("base64").match(/.{1,6000}/g)||[];console.log("GH_AURA_IMAGE_INFO:"+JSON.stringify({name,bytes:buf.length,parts:p.length}));p.forEach((v,i)=>console.log("GH_AURA_IMAGE_PART_"+name+"_"+(i+1)+"_"+p.length+":"+v));'
          done
