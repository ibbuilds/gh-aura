name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    # Standard runners are free for public repositories. Private forks opt in by editing this guard.
    if: github.event.repository.private == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm run check
      - run: npm test
      - run: npm run test:package

  live:
    name: Public GitHub integration (read-only)
    if: github.event.repository.private == false && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run test:live
        env:
          GH_TOKEN: ${{ github.token }}
      # No Actions artifacts, cache uploads, paid runners or hosted services.

  release:
    name: Publish versioned GitHub package
    needs: [test, live]
    if: github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Publish only a new version; never overwrite a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable semantic version'; exit 1; }
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          (cd dist && sha256sum "gh-aura-$VERSION.tgz" > SHA256SUMS.txt)
          gh release create "$TAG" "dist/gh-aura-$VERSION.tgz" dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "GH Aura $TAG" --notes-file docs/RELEASE_NOTES.md

      # Delete older release objects only after the new tarball and checksum exist.
      # Leave Git tags and repository history intact.
      - name: Keep only the current published GitHub Release
        if: github.repository == 'ibbuilds/gh-aura'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GH_REPO" == 'ibbuilds/gh-aura' ]] || exit 1
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          TAG="v$VERSION"
          # Fail before deletion if publishing or uploads did not complete.
          current="$(gh api "repos/$GH_REPO/releases/tags/$TAG")"
          jq -e --arg tar "gh-aura-$VERSION.tgz" '
            (.draft == false) and (.prerelease == false) and
            (([.assets[].name] | index($tar)) != null) and
            (([.assets[].name] | index("SHA256SUMS.txt")) != null)
          ' <<< "$current" >/dev/null
          # Use exact published-release tags; nonstandard tags and drafts are not deleted.
          published="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          deleted=0
          while IFS= read -r old; do
            [[ -n "$old" && "$old" != "$TAG" ]] || continue
            if [[ ! "$old" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Skipping non-version release $old"
              continue
            fi
            echo "Removing old published release $old (keeping Git tag)"
            gh release delete "$old" --yes
            deleted=$((deleted + 1))
          done <<< "$published"
          # Verify the intended release still exists after cleanup.
          gh release view "$TAG" >/dev/null
          remaining="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          if [[ "$remaining" != "$TAG" ]]; then
            echo "Release cleanup incomplete; Git tags remain intact."
            exit 1
          fi
          echo "Retained $TAG; removed $deleted obsolete published releases."
