name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    # Standard runners are free for public repositories. Private forks opt in by editing this guard.
    if: github.event.repository.private == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm run check
      - run: npm test
      - run: npm run test:package

  live:
    name: Public GitHub integration (read-only)
    if: github.event.repository.private == false && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run test:live
        env:
          GH_TOKEN: ${{ github.token }}
      # No Actions artifacts, cache uploads, paid runners or hosted services.

  release:
    name: Publish versioned GitHub package
    needs: [test, live]
    if: github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Publish only a new version; never overwrite a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable semantic version'; exit 1; }
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          (cd dist && sha256sum "gh-aura-$VERSION.tgz" > SHA256SUMS.txt)
          gh release create "$TAG" "dist/gh-aura-$VERSION.tgz" dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "GH Aura $TAG" --notes-file docs/RELEASE_NOTES.md

      # Intentionally runs ONLY for the explicitly named repository-cleanup merge.
      # GitHub's ordinary read/write tools do not expose branch deletion.
      - name: One-time, lease-guarded deletion of obsolete heads
        if: startsWith(github.event.head_commit.message, 'chore(cleanup):') && github.repository == 'ibbuilds/gh-aura'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GH_REPO" == "ibbuilds/gh-aura" ]] || exit 1
          open_refs="$(gh api "repos/$GH_REPO/pulls?state=open&per_page=100" --jq '.[].head.ref')"
          deleted=0
          while read -r branch expected; do
            [[ -n "$branch" ]] || continue
            if [[ ! "$branch" =~ ^(feat|perf|release|docs|research)/[a-zA-Z0-9._/-]+$ ]]; then
              echo "Unsafe name skipped: $branch"
              continue
            fi
            if grep -Fxq "$branch" <<< "$open_refs"; then
              echo "Active PR branch skipped: $branch"
              continue
            fi
            current="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [[ "$current" != "$expected" ]]; then
              echo "Moved or missing branch skipped: $branch"
              continue
            fi
            if gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null; then
              echo "Deleted obsolete branch $branch"
              ((deleted += 1))
            else
              echo "Could not delete $branch; no force update attempted."
            fi
          done <<'OBSOLETE_BRANCHES'
          docs/definitive-roadmap ccd7fe4732b26232cd7d2cdfc836a3c2ec210d87
          feat/achievement-task-preparation 279822ce03b2d23821cbfec63479f2681648f7c7
          feat/achievements-capability-registry 7d39097b9032805e3daed2a78df2cbd09ee7ded9
          feat/activity-date-ranges 0517f99960eacaa224b5912fdb6b69fb190a9d87
          feat/authentic-future-work-plan 0532adca7298271146279e2ef787ddf260d80ac8
          feat/cli-only-presets aa6e728fec295f867493c30e3b68dfd48ab789a3
          feat/cli-project-stories a92bc4a90234f4a5cfc8df450b54edc6c2c0cd47
          feat/deep-project-evidence 6397f9c53859bb438734ccdd6ea56744c518a707
          feat/evidence-and-diff f538f982243a32fd519932b1076ee16ba344c322
          feat/hiring-readiness-audit f59656f192e619b037d4ebc4bdcf14eeb87c33d7
          feat/local-attribution-check 7c1b0de1cac8cce634d83871545b1605c57bfd67
          feat/local-job-evidence ad37592f79206d2191648ca6b3af5460cdd06db0
          feat/ordinary-200-and-simple-cli a0acf97b9cef482a9bedc63109732760b2461f15
          feat/professional-engineer-references 2b3d7f69a5296c70ec27915802bf653a0d0f3a57
          feat/profile-language-en-es 74364957cd599c6ece17f120725535d17f1706bd
          feat/profile-project-stories c32c141ae58d605588c6d071edee8ed6062b8a55
          feat/reviewed-documentation-work-pr 00ffb18520a2431a08ab7355a37894db4df5ca17
          feat/reviewed-profile-workflow 696d96f3013d68ba1da7b28d4f104626e232135b
          feat/verified-project-signals 6425afa28db228f5e82f6ffe502baf6b7d9208c2
          perf/evidence-editor-v1.2 07d624cea8ba63e7c7e9a3585bec6c25ac9c0410
          release/v1-cli 2ecb88ea8f00f57bae70a6f629547bdb1f99b167
          release/v1.1-free-workflow bd3e0b618f2b34d3da2a889b13137904de20c70e
          release/v1.5.1 c12c935b975173f776a26d5b61ea93063b0c2684
          release/v1.6.0 8ac103569659dc474d118ef66a97fd63eb35a2b7
          research/company-engineers-20261111 4eeb94b7e90a136e0c7b07262c3f006780a5f11a
          research/ordinary-engineers-20261111 b7e5d8f73acddf3e3927f7dd649084aabbfdaaf0
          research/profile-baseline-20261111 69189227848f494d209c11b9f69d861421390f5a
          feat/calendar-studio 833e48f50d1efb4a95d07e26ffb94facd1b5888d
          feat/private-badge-run 137b1467bc9d03f51e6ef22e1375fff5cbef42b6
          release/v1.8.0 ade201b8bb56fb2e0bd73169790b9edaa071a599
          OBSOLETE_BRANCHES

          # Delete the merged maintenance PR head only if its ref still has the
          # exact head SHA GitHub recorded for that PR. Never delete moved work.
          own_pr="$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/pulls" \
            --jq '.[] | select(.merged_at != null and (.head.ref == "chore/repo-cleanup" or .head.ref == "fix/v1.8.1-release-readiness")) | [.head.ref,.head.sha] | @tsv' 2>/dev/null || true)"
          if [[ -n "$own_pr" ]]; then
            read -r own expected_own <<< "$own_pr"
            current_own="$(gh api "repos/$GH_REPO/git/ref/heads/$own" --jq '.object.sha' 2>/dev/null || true)"
            if [[ "$current_own" == "$expected_own" ]]; then
              gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$own" >/dev/null || true
            else
              echo "Merged maintenance branch moved or disappeared; leaving it alone."
            fi
          fi
          echo "Pruned $deleted obsolete branches (unchanged heads only)."
