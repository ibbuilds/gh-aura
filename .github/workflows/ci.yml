name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: npm run check
      - name: Unit and CLI tests
        run: npm test
      - name: npm package preview
        run: npm pack --dry-run
      - name: CLI smoke test
        run: |
          node src/cli.mjs --help
          node src/cli.mjs achievements --format json > /tmp/gh-aura-achievements.json
