name: Temporary offline holistic category report generation (rendered README correction)
on:
  push:
    branches: [research/holistic-category-triage]
    paths: ['.github/workflows/holistic-triage-generate.yml']
permissions:
  contents: read
jobs:
  report:
    if: github.repository == 'ibbuilds/gh-aura'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test and generate deterministic provisional review queues
        run: |
          set -euo pipefail
          node --test tests/holistic-style-triage.test.mjs
          node scripts/triage-holistic-categories.mjs --json /tmp/category-triage.json --markdown /tmp/category-triage.md
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          for(const [label,path] of [['JSON','/tmp/category-triage.json'],['MARKDOWN','/tmp/category-triage.md']]){
            const buf=readFileSync(path);
            const parts=buf.toString('base64').match(/.{1,6000}/g)||[];
            console.log('GH_AURA_TRIAGE_SIZE:'+JSON.stringify({label,bytes:buf.length,chunks:parts.length}));
            parts.forEach((part,i)=>console.log('GH_AURA_TRIAGE_'+label+'_'+(i+1)+'_'+parts.length+':'+part));
          }
          JS
