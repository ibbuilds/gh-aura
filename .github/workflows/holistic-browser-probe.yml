name: Temporary public profile HTML collector pilot
on:
  push:
    branches: [research/holistic-category-triage]
    paths: ['.github/workflows/holistic-browser-probe.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Observe five public rendered profile pages without storing prose or images
        run: |
          set -euo pipefail
          node scripts/research-profile-html.mjs --start 0 --limit 5 --input research/graphql-observations/batch-000.json --output /tmp/profile-html.json
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync('/tmp/profile-html.json','utf8'));
          console.log('GH_AURA_HTML_SUMMARY:'+JSON.stringify({queried:p.queried,
            observed:p.pageObserved,achievements:p.achievementsVisible,
            rendered:p.renderedReadmes,items:p.profiles.map(x=>({login:x.login,state:x.state,
            badges:x.achievements.items.map(a=>a.slug),render:x.renderedReadme.state}))}));
          const {parsePublicProfileHtml}=await import('./scripts/research-profile-html.mjs');
          const r=await fetch('https://github.com/WenyuChiou',{headers:{'User-Agent':'GH-Aura-public-profile-research'},signal:AbortSignal.timeout(12000)});
          const html=await r.text(),mi=html.search(/class="[^"]*\\bmarkdown-body\\b[^"]*"/);
          const bi=html.lastIndexOf('<article',mi),ei=html.indexOf('</article>',mi);
          const result=parsePublicProfileHtml('WenyuChiou',html,new Date().toISOString());
          console.log('GH_AURA_README_DEBUG:'+JSON.stringify({mi,bi,ei,marker:html.slice(Math.max(0,mi-160),mi+140).replace(/\\s+/g,' ').slice(0,300),
            render:result.renderedReadme,badges:result.achievements.items.length}));
          JS
