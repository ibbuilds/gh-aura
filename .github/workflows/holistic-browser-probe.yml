name: Temporary public profile DOM achievements probe
on:
  push:
    branches: [research/holistic-category-triage]
    paths: ['.github/workflows/holistic-browser-probe.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Inspect visible achievement segment and profile README HTML boundaries
        run: |
          node --input-type=module - <<'JS'
          for(const login of ['simonw','WenyuChiou','karpathy']){
            const r=await fetch('https://github.com/'+login,{signal:AbortSignal.timeout(12000),
              headers:{'User-Agent':'GH-Aura-public-profile-research','Accept':'text/html'}});
            const t=await r.text();
            const i=t.indexOf('>Achievements</a>');
            const cut=i>=0?t.slice(i,Math.min(t.length,i+2800)):'';
            const badges=[...cut.matchAll(/\?achievement=([^&"\s]+)&amp;tab=achievements/g)].map(m=>m[1]);
            const idx=t.indexOf('markdown-body');
            const av=t.indexOf('avatar-user');
            console.log('BADGES:'+JSON.stringify({login,status:r.status,badges:[...new Set(badges)],
              section:cut.replace(/\s+/g,' ').slice(0,1100),markdownBodyIdx:idx,avatarIndex:av}));
          }
          JS
