name: Temporary public GitHub rendered-profile research
on:
  push:
    branches: [research/holistic-category-triage]
    paths: ['.github/workflows/holistic-browser-probe.yml']
permissions:
  contents: read
jobs:
  observe:
    if: github.repository == 'ibbuilds/gh-aura'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        start: [0, 50, 100, 150, 200, 250, 300, 350, 400, 450, 500, 550]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Inspect public profile HTML and visible badge links (no token)
        env:
          START: ${{ matrix.start }}
        shell: bash
        run: |
          set -euo pipefail
          INPUT=$(printf 'research/graphql-observations/batch-%03d.json' "$START")
          node scripts/research-profile-html.mjs --start "$START" --limit 50 --input "$INPUT" --sleep-ms 400 --output /tmp/public-html.json
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync('/tmp/public-html.json','utf8'));
          if(data.schema!=='gh-aura-public-html-facets-batch-v1'||data.queried!==50)
            throw Error('Invalid bounded HTML research result');
          const payload=Buffer.from(JSON.stringify(data)).toString('base64');
          const parts=payload.match(/.{1,6000}/g)||[];
          parts.forEach((p,i)=>console.log('GH_AURA_HTML_PAYLOAD_'+(i+1)+'_'+parts.length+':'+p));
          console.log('GH_AURA_HTML_COUNTER:'+JSON.stringify({start:data.sourceBatchStart,
            queried:data.queried,pageObserved:data.pageObserved,
            achievementsVisible:data.achievementsVisible,renderedReadmes:data.renderedReadmes,
            completeProfileReviews:0}));
          JS
