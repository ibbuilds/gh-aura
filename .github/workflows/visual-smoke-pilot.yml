name: Temporary GitHub public profile four-view render sweep
on:
  push:
    branches: [research/holistic-visual-render-smoke]
    paths: ['.github/workflows/visual-smoke-pilot.yml']
permissions:
  contents: read
jobs:
  smoke:
    if: github.repository == 'ibbuilds/gh-aura'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        start: [0, 50, 100, 150, 200, 250, 300, 350, 400, 450, 500, 550]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Render desktop/mobile light/dark public pages without storing screenshots
        env:
          GH_AURA_CHROME: google-chrome
          START: ${{ matrix.start }}
        shell: bash
        run: |
          set -euo pipefail
          INPUT=$(printf 'research/graphql-observations/batch-%03d.json' "$START")
          node scripts/visual-profile-smoke.mjs --input "$INPUT" --start "$START" --limit 50 --output /tmp/visual-smoke.json
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync('/tmp/visual-smoke.json','utf8'));
          if(data.checked!==50||data.schema!=='gh-aura-four-view-render-smoke-v1')
            throw Error('Invalid visual smoke result');
          const content=Buffer.from(JSON.stringify(data)).toString('base64');
          const parts=content.match(/.{1,6000}/g)||[];
          parts.forEach((p,i)=>console.log('GH_AURA_SMOKE_PART_'+(i+1)+'_'+parts.length+':'+p));
          console.log('GH_AURA_SMOKE_SUMMARY:'+JSON.stringify({
            start:data.start,checked:data.checked,complete4:data.complete4,
            partial:data.partial,failed:data.failed,editorialReviews:0}));
          JS
