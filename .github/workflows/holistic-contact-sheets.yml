name: Temporary 8-style public profile screenshots (browser-only composition)
on:
  push:
    branches: [research/holistic-category-triage]
    paths: ['.github/workflows/holistic-contact-sheets.yml']
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [native, minimal, technical, showcase, visual, terminal, dashboard, dynamic]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Capture four public profile screenshots and compose HTML grid locally
        env:
          GROUP: ${{ matrix.group }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gh-aura-visual
          case "$GROUP" in
            native) people="amelia2802 AyushSarode 0intro 1st1" ;;
            minimal) people="mattabate serenakeyitan antfu rasbt" ;;
            technical) people="morluto SamuelSchlesinger martincostello jeroenvervaeke" ;;
            showcase) people="guichristovao dereknguyen269 mokkapps benjamincanac" ;;
            visual) people="WenyuChiou fzn0x davidgcs yetone" ;;
            terminal) people="orhun FlorentCollin fzn0x laohanme" ;;
            dashboard) people="gautamkrishnar swyxio anuraghazra Abiola-Farounbi" ;;
            dynamic) people="simonw eugeneyan Flipez athul" ;;
            *) exit 2 ;;
          esac
          n=0
          for user in $people; do
            n=$((n+1))
            raw=$(printf '/tmp/gh-aura-visual/%02d-%s.png' "$n" "$user")
            timeout 48 chromium --headless --no-sandbox --disable-gpu --hide-scrollbars --disable-extensions --disable-dev-shm-usage --virtual-time-budget=1600 --window-size=1100,1900 --screenshot="$raw" "https://github.com/$user" >/tmp/chrome-last 2>&1 || true
            if [[ ! -s "$raw" ]]; then echo "SCREENSHOT_UNAVAILABLE:$user"; fi
          done
          node -e 'const fs=require("fs"),path=require("path"),files=fs.readdirSync("/tmp/gh-aura-visual").filter(x=>x.endsWith(".png")).sort();if(!files.length)process.exit(2);const cards=files.map(x=>"<figure><figcaption>"+x.replace(/\.png$/,"")+"</figcaption><img src=\"data:image/png;base64,"+fs.readFileSync(path.join("/tmp/gh-aura-visual",x)).toString("base64")+"\"/></figure>").join("");fs.writeFileSync("/tmp/gh-aura-contact.html","<!doctype html><html><head><meta charset=\"utf-8\"><style>body{margin:0;padding:12px;background:#e9e9e9;display:grid;grid-template-columns:1fr 1fr;gap:14px}figure{margin:0;background:#fff}figcaption{font:24px Arial;padding:7px 10px;color:#111}img{display:block;width:100%;height:1120px;object-fit:cover;object-position:top}</style></head><body>"+cards+"</body></html>");console.log("SCREENSHOT_COUNT:"+files.length);'
          timeout 50 chromium --headless --no-sandbox --disable-gpu --disable-extensions --disable-dev-shm-usage --allow-file-access-from-files --virtual-time-budget=1500 --window-size=1510,2460 --screenshot=/tmp/gh-aura-contact.png "file:///tmp/gh-aura-contact.html" >/tmp/chrome-contact 2>&1
          node -e 'const fs=require("fs"),group=process.env.GROUP;const b=fs.readFileSync("/tmp/gh-aura-contact.png");const p=b.toString("base64").match(/.{1,6000}/g)||[];console.log("GH_AURA_SHEET_INFO:"+JSON.stringify({group,bytes:b.length,parts:p.length}));p.forEach((v,i)=>console.log("GH_AURA_SHEET_PART_"+group+"_"+(i+1)+"_"+p.length+":"+v));'
