name: GH Aura bounded public-profile metadata retry (temporary)
on:
  push:
    branches: [research/public-profile-observations-500]
    paths: ['.github/workflows/holistic-research-pilot.yml']
permissions:
  contents: read
jobs:
  collect:
    if: github.repository == 'ibbuilds/gh-aura'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        start: [150, 200]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Inspect public GitHub metadata, without writes or private profile content
        env:
          GH_TOKEN: ${{ github.token }}
          OFFSET: ${{ matrix.start }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/research-holistic-profiles.mjs --start "$OFFSET" --limit 50 --batch-size 5 --budget 18 --output observed.json
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync('observed.json','utf8'));
          if(data.schema!=='gh-aura-holistic-api-observation-batch-v1'||data.requested!==50)
            throw Error('Incomplete data batch');
          const encoded=Buffer.from(JSON.stringify(data)).toString('base64');
          const parts=encoded.match(/.{1,6000}/g)||[];
          parts.forEach((part,i)=>process.stdout.write('GH_AURA_PAYLOAD_'+(i+1)+'_'+parts.length+':'+part+'\n'));
          console.log('GH_AURA_COUNTER:'+JSON.stringify({start:data.start,requested:data.requested,responded:data.responded,requests:data.requests,fullProfileReviews:0}));
          JS
